<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#1d1f24; --muted:#6b6f78; --line:#e3e1da;
  --accent:#1f5f8b; --accent-soft:#e3eef6; --ok:#2e7d4f; --ok-soft:#e4f3ea;
  --warn:#9a6a00; --warn-soft:#fbf1d9; --bad:#b03a2e; --bad-soft:#f8e3e0;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171b; --card:#1f2228; --ink:#eceae4; --muted:#9aa0aa; --line:#30343c;
  --accent:#7fb6dc; --accent-soft:#1d3342; --ok:#7fcf9c; --ok-soft:#1c3226; --warn:#e4b84f; --warn-soft:#3a3019; --bad:#ef8a7d; --bad-soft:#3d2320;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.wrap{max-width:540px;margin:0 auto;padding:12px 14px 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px 10px;position:sticky;top:0;z-index:8;background:var(--bg);margin:0 -2px;box-shadow:0 8px 8px -8px rgba(0,0,0,.12)}
header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
header .sub{font-size:12px;color:var(--muted)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.monthnav span{min-width:108px;text-align:center;font-weight:600;font-size:14px;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--ok)} .neg{color:var(--bad)} .row .neg{font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)} .row.tot{font-weight:700;border-top:1px solid var(--line);border-bottom:0;margin-top:4px;padding-top:9px}
.row.tot .k{color:var(--ink)}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;background:var(--accent);color:#fff;width:100%}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.small{padding:8px 10px;font-size:13px;width:auto}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2>div,.grid3>div{min-width:0} input[type=date],input[type=time]{min-width:0;-webkit-appearance:none;appearance:none}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--ink)}
.check input{width:20px;height:20px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.alert{border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.day:last-child{border-bottom:0}
.day .d{font-weight:650;font-variant-numeric:tabular-nums}
.day .d small{display:block;font-weight:500;color:var(--muted);font-size:11px;text-transform:capitalize}
.day .info{font-size:13px;color:var(--muted)}
.day .h{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.day.today{background:var(--accent-soft);border-radius:10px;padding-left:6px;padding-right:6px}
.day.off .d{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:650;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--ink);margin-right:4px}
.tag.vacaciones{background:var(--ok-soft);color:var(--ok)}
.tag.festivo{background:var(--warn-soft);color:var(--warn)}
.tag.teletrabajo{background:var(--accent-soft);color:var(--accent)}
.tag.libre_ret{background:var(--ok-soft);color:var(--ok)}
.tag.baja,.tag.permiso{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;min-width:0;background:none;border:0;color:var(--muted);font-size:10px;font-weight:600;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px}
.typepick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.typepick button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 11px;font-size:13px;font-weight:600}
.typepick button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.status{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.clock{font-size:34px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.center{text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600}
details summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.hidden{display:none}
.yearnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.yearnav b{font-size:20px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.cal-mode{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.cal-mode button{flex:1;border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:8px;border-radius:9px}
.cal-mode button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.months{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.months{grid-template-columns:1fr 1fr}}
.mon h3{margin:0 0 6px;font-size:15px;text-transform:capitalize;display:flex;justify-content:space-between}
.mon h3 small{font-weight:500;color:var(--muted);font-size:12px;text-transform:none}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mgrid .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.c{aspect-ratio:1/1;max-height:46px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;user-select:none;position:relative}
.c.e{cursor:default}
.c.we{color:var(--muted);background:transparent;font-weight:500}
.c.lab{background:var(--bg)}
.c.nac{background:#c0392b;color:#fff}.c.aut{background:#d9822b;color:#fff}.c.loc{background:#8e44ad;color:#fff}
.c.vac{background:var(--ok);color:#fff}.c.tele{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}.c.lret{background:#2a9d8f;color:#fff}
.c.fest{background:#b9770e;color:#fff}.c.perm{background:var(--bad-soft);color:var(--bad)}
.c.vac.fut{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.c.today{outline:2px solid var(--accent);outline-offset:1px}
.c.prov::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:#fff}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:10px}
.stack i{display:block;height:100%}
.evo{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:90px;margin-top:10px}
.evo div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted)}
.evo span.b{width:100%;background:var(--ok);border-radius:4px 4px 0 0;min-height:2px}
.evo span.b.f{background:transparent;box-shadow:inset 0 0 0 2px var(--ok)}
.evo em{font-style:normal;font-weight:700;color:var(--ink);font-size:11px}
#printArea{display:none}
@media print{
  body{padding:0!important;background:#fff!important}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  @page{size:A4;margin:12mm}
}
</style>
</head>

<div class="wrap">

</nav>

<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>

<script>
/* =====================================================================
   DATOS DEL CONVENIO Y PARÁMETROS LEGALES
   Fuentes:
   - Convenio colectivo estatal de mediación de seguros privados 2023-2026
     (BOE 15/11/2023, BOE-A-2023-23188; corrección BOE 08/06/2024).
     Tablas transcritas de la circular 10/2023 de AEMES (Anexos I-IV).
   - SMI 2026: RD 126/2026 (1.221 €/mes x 14 = 17.094 €/año).
   - Cotización 2026: Orden PJC/297/2026 y RDL 3/2026 (base máx. 5.101,20 €;
     CC 4,70 %, MEI 0,15 %, desempleo 1,55/1,60 %, FP 0,10 % a cargo del trabajador).
   ===================================================================== */
const SB = { // sueldo base mensual por nivel (x14)
  2023:{1:2512.10,2:2084.50,3:1924.17,4:1763.84,5:1603.50,6:1336.24,7:1282.78,8:1122.44,9:1080.00},

  2025:{1:2665.09,2:2211.44,3:2041.35,4:1871.25,5:1701.16,6:1417.62,7:1360.90,8:1190.79,9:1145.77},
  2026:{1:2698.40,2:2239.09,3:2066.87,4:1894.64,5:1722.42,6:1435.34,7:1377.92,8:1205.67,9:1160.09}
};
const CPE = { // complemento por experiencia: importe mensual por año (máx. 10 años)
  2023:{4:16.03,5:16.03,6:26.73,7:5.35,8:16.03},
  2024:{4:16.51,5:16.51,6:27.53,7:5.51,8:16.51},
  2025:{4:17.00,5:17.00,6:28.36,7:5.67,8:17.00},

};
const KM = {2023:0.365,2024:0.365,2025:0.375,2026:0.38};
const SMI_ANUAL = {2023:15120,2024:15876,2025:16576,2026:17094};
const BASE_MAX = {2023:4495.50,2024:4720.50,2025:4909.50,2026:5101.20};
const MEI_TRAB = {2023:0.10,2024:0.12,2025:0.13,2026:0.15};
const JORNADA_ANUAL = 1720;
const DIETA_PERNOCTA = 36, DIETA_SIN = 15.50, COMIDA = 13;
const KM_EXENTO = 0.26; // límite exento IRPF por km (vehículo propio)
const GRUPOS = {1:"I",2:"II.A",3:"II.B · V.A",4:"III.A · V.B",5:"III.B1 · V.C1",6:"III.C (y III.B2/V.C2 de entrada)",7:"IV.A",8:"III.D · IV.B",9:"VI"};
const TIPOS = [
  ["trabajo","Trabajo"],["teletrabajo","Teletrabajo"],["vacaciones","Vacaciones"],
  ["festivo","Festivo"],["permiso","Permiso retrib."],["libre_ret","Día libre retrib."],["baja","Baja (IT)"],["libre","Libre"]
];
/* Festivos Zaragoza capital.
   2026: BOE 28/10/2025 (nacionales), Decreto 70/2025 Gobierno de Aragón (BOA 16/07/2025), locales BOA 20/11/2025.

const HOL = {

const APP_VERSION = "v16";

/* ============================ ESTADO ============================ */
const DEFAULT_PERFIL = {
  nombre:"", nivel:3, sbManual:0, brutoAnual:0, numPagas:14, varPct:0, varCumpl:100, varPago:"anual", varMes:2, varDesde:0, cpeAnios:0, pae:0, otros:0, complEnExtras:true, varConvPct:0,

const now0 = new Date();

let mode="local";

/* ============================ UTILIDADES ============================ */
const pad = n => String(n).padStart(2,"0");
const ymKey = (y,m) => `${y}-${pad(m)}`;
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => dkey(new Date());
// Formato español fijo: punto de miles y coma decimal (Intl en es-ES no agrupa números de 4 cifras).
function fmtNum(n,d){
  n = Number(n); if(!isFinite(n)) n=0;
  const f = Math.pow(10,d); let r = Math.round(Math.abs(n)*f)/f; const neg = n<0 && r>0;
  let [i,dec] = r.toFixed(d).split(".");
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return (neg?"-":"")+i+(dec?","+dec:"");
}
const eur = n => fmtNum(n,2)+"\u00a0€";
const eurR = n => `<span class="neg">−${fmtNum(Math.abs(n),2)}\u00a0€</span>`; // importe que resta, en rojo
const num = (n,d=1) => fmtNum(n,d);
const r2 = n => Math.round(n*100)/100;
const toMin = t => { if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
const hhmm = () => { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const monthName = (y,m) => new Date(y,m-1,1).toLocaleDateString("es-ES",{month:"long",year:"numeric"});
function daysIn(y,m){ return new Date(y,m,0).getDate(); }
function fmtH(h){ const tot=Math.round(Math.abs(Number(h)||0)*60); const s=(h<0&&tot>0)?"-":""; const H=Math.floor(tot/60), M=tot%60; return `${s}${fmtNum(H,0)}h${M?(" "+pad(M)):""}`; }

const LS_KEY = "micontrol-mediacion-v1";
function lsLoad(){ try{ const t=localStorage.getItem(LS_KEY); if(t){ const o=JSON.parse(t); if(o.perfil&&o.perfil.horasDia&&JSON.stringify(o.perfil.horasDia)===JSON.stringify({0:0,1:8,2:8,3:8,4:8,5:7,6:0})) delete o.perfil.horasDia; S.perfil={...DEFAULT_PERFIL,...o.perfil, horasDia:{...DEFAULT_PERFIL.horasDia,...((o.perfil||{}).horasDia||{})}}; S.months=o.months||{}; S.nominas=o.nominas||{}; } }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

function save(){ lsSave(); setStatus("Guardado en este dispositivo"); }
function setStatus(t,bad){ const el=document.getElementById("status"); el.textContent=t; el.style.color=bad?"var(--bad)":""; }
async function initStore(){
  mode="local"; lsLoad(); autoClose(); render();
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); setStatus("Datos guardados en este dispositivo"); }
  catch(e){ banner(`<div class="alert bad">Este navegador no permite guardar datos (¿modo privado?). Lo que anotes se perderá al cerrar.</div>`); }
  if("serviceWorker" in navigator){
    try{
      const habia = !!navigator.serviceWorker.controller;
      const reg = await navigator.serviceWorker.register("sw.js", {updateViaCache:"none"});
      let recargando=false;
      navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(habia && !recargando){ recargando=true; location.reload(); } });
      const buscar = ()=>{ try{ reg.update(); }catch(e){} };
      buscar();
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) buscar(); });
      window.__buscarActualizacion = buscar;
    }catch(e){}
  }
}

/* ============================ CÁLCULOS ============================ */
function monthDoc(y,m){ const k=ymKey(y,m); if(!S.months[k]) S.months[k]={dias:{}}; return S.months[k]; }
function dayEntry(date){ const k=date.slice(0,7); return (S.months[k]&&S.months[k].dias[date])||null; }

function altaF(){ return S.perfil.fechaAlta || S.perfil.fechaAntiguedad || ""; }
function esVerano(date){ const p=S.perfil; return p.veranoOn && (p.veranoMeses||[]).map(Number).includes(+date.slice(5,7)); }
function teorDia(date){ // horas teóricas por calendario del perfil (con jornada intensiva)
  const p=S.perfil, wd=new Date(date+"T12:00:00").getDay();
  if(altaF() && date < altaF()) return 0;
  const tabla = esVerano(date) ? (p.horasVerano||{}) : p.horasDia;
  return Number(tabla[wd]||0);
}
function autoClose(){ // cierra jornadas abiertas a la hora prevista (si está activado)
  if(!S.perfil.autoSalida) return false;
  const tk=todayKey(), nowM=toMin(hhmm()); let changed=false;
  for(const [k,md] of Object.entries(S.months)){
    for(const [date,e] of Object.entries(md.dias)){
      if(!e.e || e.s || date>tk || teorDia(date)<=0) continue;
      const pa = esPartida(date) ? (e.p!==undefined?Number(e.p):Number(S.perfil.pausaDef)||0) : (Number(e.p)||0);
      const fin = toMin(e.e) + Math.round(teorDia(date)*60) + (esPartida(date)?pa:0);
      if(date===tk && (fin>=1440 || nowM<fin)) continue;
      const f=Math.min(fin,1439);
      md.dias[date]={...e, s:`${pad(Math.floor(f/60))}:${pad(f%60)}`, p:pa, auto:true};
      save("m-"+k); changed=true;
    }
  }
  return changed;
}
function esPartida(date){ return teorDia(date) > 7 && !esVerano(date); } // jornada con pausa para comer
function salidaPrevista(e, date, pausa){
  const t=teorDia(date); if(!e||!e.e||!t) return null;
  const mins = toMin(e.e) + Math.round(t*60) + (esPartida(date)?pausa:0);
  return `${pad(Math.floor(mins/60)%24)}:${pad(mins%60)}`;
}
function workedOf(e){
  if(!e||!e.e||!e.s) return 0;
  let a=toMin(e.e), b=toMin(e.s); if(b<a) b+=1440;
  return Math.max(0,(b-a-(Number(e.p)||0))/60);
}
function libreAuto(date){ // 24 y 31 dic y cumpleaños, solo si son laborables
  const p=S.perfil; if(teorDia(date)<=0 || holiday(date)) return null;
  const md=date.slice(5);
  if(p.dias2431 && (md==="12-24"||md==="12-31")) return md==="12-24"?"24 de diciembre":"31 de diciembre";
  const cd=cumpleDia(+date.slice(0,4)); if(cd && cd===date) return "Cumpleaños";
  return null;
}
function cumpleDia(y){ // fecha de disfrute del día de cumpleaños ese año
  const p=S.perfil; const alt=(p.cumpleAlt||{})[y]; if(alt) return alt;
  if(!p.cumple) return null; const d=`${y}-${p.cumple.slice(5)}`;
  return (teorDia(d)>0 && !holiday(d)) ? d : null;
}
function tipoOf(date,e){ if(e&&e.t) return e.t; if(holiday(date)) return "festivo"; if(libreAuto(date)) return "libre_ret"; return teorDia(date)>0?"trabajo":"libre"; }

function horasMes(y,m,hastaHoy){
  const tk=todayKey(); let teor=0,trab=0,teorHoy=0,teorReg=0,sinReg=0,tele=0,telePlan=0,efect=0,vac=0,fest=0,diasTrab=0;
  for(let d=1; d<=daysIn(y,m); d++){
    const date=`${y}-${pad(m)}-${pad(d)}`, e=dayEntry(date), t=tipoOf(date,e);
    const td = NEUTROS.includes(t)?0:teorDia(date);
    const w = workedOf(e);
    teor+=td; trab+=w;
    if(date<=tk) teorHoy+=td;
    if(e && e.e && e.s) teorReg+=td;
    if(t==="teletrabajo" && w>0) tele++;
    if(t==="teletrabajo") telePlan++;
    if(td>0) efect++;
    if(t==="vacaciones" && teorDia(date)>0) vac++;
    if(t==="festivo") fest++;
    if(w>0) diasTrab++;
    if(td>0 && date<=tk && !(e&&(e.e||e.s))) sinReg++;
  }
  const teleObj=Math.round(efect*(Number(S.perfil.telePct)||0)/100);
  return {teor,trab,teorHoy,teorReg,sinReg,tele,telePlan,efect,teleObj,vac,fest,diasTrab, saldo: trab-teorReg};
}
function horasAnio(y){
  let trab=0,teor=0; for(let m=1;m<=12;m++){ const h=horasMes(y,m,false); trab+=h.trab; teor+=h.teor; } return {trab,teor};
}

function antiguedadAnios(y){ // años cumplidos a 31/12 del año y
  const f=S.perfil.fechaAntiguedad||S.perfil.fechaAlta; if(!f) return null;
  const a=new Date(f+"T12:00:00"); return y - a.getFullYear() - ((12<a.getMonth()+1)?1:0);
}
function vacaciones(y){
  const p=S.perfil; let base=Number(p.vacBase)||25, extra=0; const ant=antiguedadAnios(y);
  if(ant!==null && p.vacAntig!==false){ if(ant>=20) extra++; if(ant>=30) extra++; }
  let derecho=base+extra, prop=1;
  if(altaF()){ const a=new Date(altaF()+"T12:00:00"); if(a.getFullYear()===y){ const ini=new Date(y,0,1), fin=new Date(y,11,31); prop=((fin-a)/86400000+1)/((fin-ini)/86400000+1); } else if(a.getFullYear()>y) prop=0; }
  derecho = Math.round(derecho*prop*10)/10;
  let usadas=0; const fechas=[];
  for(let m=1;m<=12;m++){ const md=S.months[ymKey(y,m)]; if(!md) continue;
    for(const [date,e] of Object.entries(md.dias)){ if(e.t==="vacaciones" && teorDia(date)>0){ usadas++; fechas.push(date);} } }
  fechas.sort();
  const anterior = Number(p.vacAnterior)||0;
  const libres=[];
  if(p.dias2431){ ["12-24","12-31"].forEach(md=>{ const d=`${y}-${md}`; libres.push({n:md==="12-24"?"24 de diciembre":"31 de diciembre", d, ok:teorDia(d)>0}); }); }
  if(p.cumple){ const d0=`${y}-${p.cumple.slice(5)}`, cd=cumpleDia(y); libres.unshift({n:"Cumpleaños", d:cd||d0, ok:!!cd, alt:!!(p.cumpleAlt||{})[y]}); }
  return {base,extra,prop,derecho,anterior,usadas,pend:derecho+anterior-usadas,fechas,ant,libres};
}

function nominaMes(y,m){
  const p=S.perfil, warn=[];
  const ty=lastYear(SB,y); if(ty!==y) warn.push(`No hay tablas del convenio para ${y}; se usan las de ${ty}. El convenio vence el 31/12/2026 y, hasta que se firme uno nuevo, se mantiene vigente.`);
  const pct=(Number(p.jornadaPct)||100)/100;
  const nivel=Number(p.nivel);
  const ba = Number(p.brutoAnual)||0;
  const nP = Math.min(16,Math.max(12,Number(p.numPagas)||14)), nEx = nP-12;
  const sbConv = SB[ty][nivel]*pct;
  const cpe = (CPE[ty][nivel]||0)*Math.min(10,Math.max(0,Number(p.cpeAnios)||0))*pct;
  const pae=Number(p.pae)||0, otros=Number(p.otros)||0;
  let sb, mejora=0, pagaU;
  if(ba>0){
    pagaU = ba/nP; sb = sbConv; mejora = pagaU-sbConv-cpe;
    if(mejora < -0.005) warn.push(`Tu salario pactado (${eur(pagaU)} por paga) queda por debajo del salario base del convenio para tu nivel más el complemento por experiencia (${eur(sbConv+cpe)}). Revísalo: el convenio es un mínimo.`);
  } else { sb = Number(p.sbManual)>0 ? Number(p.sbManual) : sbConv; pagaU = sb+cpe; }
  let fijos = pagaU+pae+otros;
  let extraUnit = (ba>0 ? pagaU : sb) + (p.complEnExtras?(ba>0?(pae+otros):(cpe+pae+otros)):0);
  const anual = fijos*12+extraUnit*nEx;
  const mesesEx=(p.mesesExtra||[]).map(Number);
  if(!p.prorrata && nEx>0 && mesesEx.length!==nEx) warn.push(`Has indicado ${nP} pagas (${nEx} extra) pero ${mesesEx.length} meses de paga extra en Ajustes. Revisa los meses.`);
  const smi = (SMI_ANUAL[lastYear(SMI_ANUAL,y)])*pct;
  let complSMI=0;
  if(anual<smi-0.005){ complSMI=(smi-anual)/nP; fijos+=complSMI; extraUnit+=complSMI; warn.push(`Tu retribución fija anual (${eur(anual)}) queda por debajo del SMI (${eur(smi)}). Se añade un complemento hasta el SMI.`); }
  const nm = (S.nominas[String(y)]||{})[pad(m)]||{};
  const h = horasMes(y,m,false);
  const precioHora = (fijos*12+extraUnit*nEx)/(JORNADA_ANUAL*pct);
  const heHoras = nm.heHoras!==undefined && nm.heHoras!=="" ? Number(nm.heHoras) : 0;
  const heImporte = p.heModo==="pago" ? heHoras*precioHora*(1+(Number(p.heRecargo)||0)/100) : 0;
  // Proporción por fecha de alta
  const fM = fracServicio(`${y}-${pad(m)}-01`, finMes(y,m));
  if(fM===0) warn.unshift(`Mes anterior a tu fecha de alta (${new Date(altaF()+"T12:00:00").toLocaleDateString("es-ES")}): no hay nómina.`);
  else if(fM<1) warn.unshift(`Mes de alta: salario proporcional a ${Math.round(fM*daysIn(y,m))} de ${daysIn(y,m)} días naturales.`);
  const extraMes = !p.prorrata && nEx>0 && mesesEx.includes(m);
  const prorrata = p.prorrata ? extraUnit*nEx/12*fM : 0;
  let fPaga = 1;
  if(extraMes){ const ord=[...mesesEx].sort((a,b)=>a-b), i=ord.indexOf(m), prev=i>0?ord[i-1]:0; fPaga = fracServicio(`${y}-${pad(prev+1)}-01`, finMes(y,m));
    if(fPaga<1 && fPaga>0) warn.push(`Paga extra proporcional al tiempo de servicio en el periodo de devengo (${num(fPaga*100,1)} %), según el art. 43 del convenio.`); }
  const paga = extraMes ? extraUnit*fPaga : 0;
  const variable = Number(nm.variable)||0;
  const fijoAnualRef = ba>0 ? ba : (fijos*12+extraUnit*nEx);
  const varAnual = fijoAnualRef*(Number(p.varPct)||0)/100*(Number(p.varCumpl)||0)/100;
  let varProg = 0;
  if(varAnual>0){
    if(p.varPago==="mensual") varProg = varAnual/12;
    else if(p.varPago==="trimestral") varProg = [3,6,9,12].includes(m) ? varAnual/4 : 0;
    else varProg = m===Number(p.varMes) ? varAnual : 0;
    // proporción: anual = objetivos del año anterior; mensual/trimestral = periodo en curso
    if(p.varPago==="mensual") varProg*=fM;
    else if(p.varPago==="trimestral") varProg*=fracServicio(`${y}-${pad(m-2)}-01`, finMes(y,m));
    else if(varProg) varProg*=fracServicio(`${y-1}-01-01`,`${y-1}-12-31`);
    const anioObj = p.varPago==="anual" ? y-1 : y;
    if(Number(p.varDesde) && anioObj < Number(p.varDesde)) varProg=0;
  }
  const varEnBase = !(Number(p.varDesde) && y < Number(p.varDesde));
  const varObj = (nm.varReal!==undefined && nm.varReal!=="") ? Number(nm.varReal) : varProg;
  const varConvAnual = SB[ty][nivel]*14*pct*(Number(p.varConvPct)||0)/100;
  // Art. 48.8: proporcional a la permanencia en el año, contando desde el día 1 del mes siguiente a la incorporación
  let fConv=1; if(altaF()){ const ay=+altaF().slice(0,4), am=+altaF().slice(5,7); if(ay===y) fConv=Math.max(0,12-am)/12; else if(ay>y) fConv=0; }
  const varConv = (m===9 && fM>0) ? varConvAnual*fConv : 0;
  const kmRate = KM[lastYear(KM,y)];
  const km = (Number(nm.km)||0)*kmRate;
  const kmExceso = (Number(nm.km)||0)*Math.max(0,kmRate-KM_EXENTO);
  const dietas = (Number(nm.dPern)||0)*DIETA_PERNOCTA+(Number(nm.dSin)||0)*DIETA_SIN+(Number(nm.comidas)||0)*COMIDA;
  const ymNow = now0.getFullYear()*12+now0.getMonth()+1, ymThis = y*12+m;
  let teleSrc, teleDias;
  if(nm.teleDias!==undefined && nm.teleDias!==""){ teleDias=Number(nm.teleDias); teleSrc="manual"; }
  else if(ymThis<ymNow){ teleDias=Math.max(h.tele,h.telePlan); teleSrc="registrado"; }
  else { teleDias=Math.max(h.telePlan,h.teleObj); teleSrc = h.telePlan>=h.teleObj && h.telePlan>0 ? "planificado" : "previsto "+num(Number(p.telePct)||0,0)+" %"; }
  const tele = teleDias*(Number(p.teleEur)||0)*pct;
  const fijosMes = fijos*fM;
  const bruto = fijosMes+prorrata+paga+heImporte+variable+varObj+varConv+km+dietas+tele;
  const bmax = BASE_MAX[lastYear(BASE_MAX,y)];
  const baseCC = Math.min(bmax, fijosMes+variable+kmExceso+(extraUnit*nEx/12+(varEnBase?varAnual/12:0)+varConvAnual/12)*fM);
  const baseAT = Math.min(bmax, baseCC+heImporte);
  const meiT = MEI_TRAB[lastYear(MEI_TRAB,y)];
  const ss = {
    cc: baseCC*0.047, mei: baseCC*meiT/100,
    des: baseAT*(p.contrato==="temporal"?0.016:0.0155), fp: baseAT*0.001, he: heImporte*0.047
  };
  const ssTot = ss.cc+ss.mei+ss.des+ss.fp+ss.he;
  const sujeto = fijosMes+prorrata+paga+heImporte+variable+varObj+varConv+kmExceso+(p.teleIRPF!==false?tele:0);
  const irpfPct = (nm.irpfPct!==undefined && nm.irpfPct!=="") ? Number(nm.irpfPct) : (Number(p.irpf)||0);
  const irpf = sujeto*irpfPct/100;
  const neto = bruto-ssTot-irpf;
  return {irpfPct,fM,fPaga,y:ty,varConv,varConvAnual,teleSrc,varAnual,varProg,varObj,fijoAnualRef,ba,nP,nEx,mejora:mejora*fM,sbConv,sb:sb*fM,cpe:cpe*fM,pae:pae*fM,otros:otros*fM,complSMI:complSMI*fM,fijos,extraUnit,anual:fijos*12+extraUnit*nEx,prorrata,paga,extraMes,heHoras,heImporte,precioHora,variable,km,kmExceso,dietas,teleDias,tele,bruto,baseCC,baseAT,ss,ssTot,meiT,sujeto,irpf,neto,warn,nm,h};
}

/* Fracción del periodo [ini, fin] (fechas "AAAA-MM-DD", inclusive) en la que hay relación laboral */
function fracServicio(ini, fin){
  const a=altaF(); if(!a || a<=ini) return 1; if(a>fin) return 0;
  const d=s=>new Date(s+"T12:00:00").getTime();
  return (Math.round((d(fin)-d(a))/86400000)+1)/(Math.round((d(fin)-d(ini))/86400000)+1);
}
const finMes=(y,m)=>`${y}-${pad(m)}-${pad(daysIn(y,m))}`;

function resumenAnual(y){ let b=0,nt=0,ss=0,ir=0; for(let m=1;m<=12;m++){ const x=nominaMes(y,m); b+=x.bruto; nt+=x.neto; ss+=x.ssTot; ir+=x.irpf; } return {b,nt,ss,ir}; }
function vInicio(){
  const tk=todayKey(), e=dayEntry(tk), isCur = cur.y===now0.getFullYear() && cur.m===now0.getMonth()+1;
  const h=horasMes(cur.y,cur.m,isCur), n=nominaMes(cur.y,cur.m), va=vacaciones(cur.y), ya=horasAnio(cur.y);
  const pctJ=(Number(S.perfil.jornadaPct)||100)/100, fA=fracServicio(`${cur.y}-01-01`,`${cur.y}-12-31`), maxA=JORNADA_ANUAL*pctJ*fA;
  let fichaje="";
  {
    const state = !e||!e.e ? "Sin fichar hoy" : (!e.s ? `Entrada a las ${e.e}` : `Jornada cerrada: ${e.e}–${e.s}${e.auto?" (salida automática)":""}`);
    fichaje = `<div class="card"><h2>Hoy · ${new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</h2>
      <div class="clock" id="clock">${hhmm()}</div>
      <div class="center note" style="margin:2px 0 12px">${esc(state)}${e&&e.e&&e.s?` · ${fmtH(workedOf(e))}`:""}</div>
      ${e&&e.e&&!e.s&&teorDia(tk)>0?(()=>{ const P=S.perfil; const pa=e.p!==undefined?Number(e.p):Number(P.pausaDef);
        return `<div class="alert info center" style="margin:-4px 0 12px">Salida prevista: <b style="font-size:17px">${salidaPrevista(e,tk,pa)}</b>${esPartida(tk)?` con ${pa}′ de comida`:" (jornada continua)"}${P.autoSalida?`<div class="note" style="margin-top:4px">Se fichará la salida automáticamente a esa hora. Si sales en otro momento, pulsa "Fichar salida".</div>`:""}
        ${esPartida(tk)?`<div style="margin-top:6px">Comida: ${[Number(P.pausaMin),45,Number(P.pausaDef)].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b).map(v=>`<button class="btn small ${pa===v?"":"ghost"}" style="margin:2px" data-act="pausa" data-v="${v}">${v}′ → ${salidaPrevista(e,tk,v)}</button>`).join("")}</div>`:""}</div>`; })():""}
      ${e&&e.e&&toMin(e.e)<toMin(S.perfil.flexDesde||"00:00")?`<div class="alert warn center" style="margin:-4px 0 12px">Has entrado antes de las ${esc(S.perfil.flexDesde)}, fuera de la flexibilidad horaria.</div>`:""}
      <div class="btns">

function vHoras(){

    const date=`${cur.y}-${pad(cur.m)}-${pad(d)}`, e=dayEntry(date), t=tipoOf(date,e), w=workedOf(e);
    const dt=new Date(date+"T12:00:00"); const off = teorDia(date)===0 && !e;
    if(date>tk && !e) { /* futuro sin datos: mostrar solo si laborable */ }
    const info = e && e.e ? `${e.e}${e.s?"–"+e.s+(e.auto?" (auto)":""):" · en curso"}${e.p?` · pausa ${e.p}′`:""}${toMin(e.e)<toMin(S.perfil.flexDesde||"00:00")?" · ⚠ antes de "+S.perfil.flexDesde:""}${esPartida(date)&&e.s&&e.p!==undefined&&Number(e.p)<Number(S.perfil.pausaMin)?" · ⚠ comida < "+S.perfil.pausaMin+"′":""}` : (NEUTROS.includes(t)&&t!=="libre"?"":(off?"no laborable":(date<=tk?"sin registrar":"")));

function vCalendario(){

      let cls="c ", title="";

    <div class="evo">${porMes.map((x,i)=>`<div>${x.p+x.f?`<em>${x.p+x.f}</em>`:""}${x.f?`<span class="b f" style="height:${x.f/maxM*60}px"></span>`:""}${x.p?`<span class="b" style="height:${x.p/maxM*60}px;${x.f?"border-radius:0":""}"></span>`:""}<span>${"EFMAMJJASOND"[i]}</span></div>`).join("")}</div>
  </div>
  <div class="card">
    <div class="cal-mode"><button data-calmode="vac" class="${calMode==="vac"?"on":""}">Vacaciones</button><button data-calmode="tele" class="${calMode==="tele"?"on":""}">Teletrabajo</button><button data-calmode="edit" class="${calMode==="edit"?"on":""}">Editar día</button></div>

    ${y===2027?`<div class="note">Los festivos locales de 2027 (San Valero y Cincomarzada, con punto blanco) son provisionales hasta su publicación en el BOA.</div>`:""}

  </div>

  ${upcoming.length?`<div class="card"><h2>Festivos ${y} · Zaragoza</h2>${upcoming.map(x=>`<div class="row"><span class="k">${new Date(x.d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"})}</span><span>${esc(x.h.n)} <span class="tag">${HOL_TIPO[x.h.t]}${x.h.prov?" · prov.":""}</span></span></div>`).join("")}

    ${S.perfil.cumple?`<label>Disfrutar el día de cumpleaños de ${cur.y} en otra fecha (opcional)</label><input type="date" data-cumplealt="${cur.y}" value="${esc((S.perfil.cumpleAlt||{})[cur.y]||"")}">`:""}

function groupRanges(dates){
  const out=[]; let s=dates[0], p=dates[0];
  const f=d=>new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"});
  const next=(a,b)=>{ let d=new Date(a+"T12:00:00"); for(let i=0;i<5;i++){ d.setDate(d.getDate()+1); const k=dkey(d); if(k===b) return true; if(teorDia(k)>0 && (dayEntry(k)||{}).t!=="festivo" && !holiday(k) && !libreAuto(k)) return false; } return false; };
  let n=1;
  for(let i=1;i<=dates.length;i++){
    if(i<dates.length && next(p,dates[i])){ p=dates[i]; n++; continue; }
    out.push(s===p?`${f(s)} · 1 día`:`${f(s)} – ${f(p)} · ${n} días`);
    s=dates[i]; p=dates[i]; n=1;
  }
  return out;
}

    <label class="check"><input type="checkbox" data-p="autoSalida" ${p.autoSalida?"checked":""}> Fichar la salida automáticamente a la hora prevista</label>
    <div class="note">Las horas son de trabajo efectivo, sin la comida. Con la flexibilidad cumples las mismas horas entrando antes o comiendo menos: si entras a las 7:00 y comes 30′, sales a las 16:00 de lunes a jueves. Al fichar la salida en jornada partida se aplica la comida habitual si no has indicado otra.<br><b>Convenio (art. 33):</b> 1.720 h efectivas al año, sin contar vacaciones, libranzas ni festivos. Recomienda no pasar de las 20:00 y dejar 12 h entre jornadas. Del 1 de junio al 30 de septiembre la jornada <i>puede</i> fijarse de 8:00 a 15:00, y tu empresa lo aplica en julio y agosto. Al pasar de jornada continua a partida, el convenio recomienda una pausa para comer de 1 a 2 h, y la compensación del almuerzo (mínimo 13 €) <i>puede</i> pactarse: tu flexibilidad de 30′ es un acuerdo de empresa. Además prevé reducir la jornada con <b>2 días de libranza al año</b> pactados con la empresa. Comprueba si son tu 24 y 31 de diciembre.</div>
    ${(()=>{ const y=now0.getFullYear(); const ha=horasAnio(y); const va=vacaciones(y); let vacH=0, n=0; for(let d=new Date(y,0,1); d.getFullYear()===y && n<400; d.setDate(d.getDate()+1),n++){} 
      const hd=p.horasDia, avg=[1,2,3,4,5].map(d=>Number(hd[d]||0)).reduce((a,b)=>a+b,0)/5; const est=ha.teor-Math.max(0,va.pend)*avg;

      <div class="note">${(Number(p.telePct)||0)>=30?"Con un "+num(Number(p.telePct),0)+" % es <b>teletrabajo regular</b> (30 % o más de la jornada en un periodo de 3 meses), así que se aplica el art. 9 del convenio.":"Por debajo del 30 % de la jornada (en 3 meses) no se considera teletrabajo regular según el convenio."}</div>`; })()}
    <label class="check"><input type="checkbox" data-p="teleIRPF" ${p.teleIRPF!==false?"checked":""}> Aplicar IRPF a la compensación</label>
    <div class="note"><b>Convenio (art. 9):</b> 1 € por día de teletrabajo efectivo a jornada completa, proporcional si la jornada es menor, actualizado cada 1 de enero con el % de subida de las tablas. No se paga en vacaciones, bajas, excedencias, libranzas ni festivos. Para 2026 resultan 1,07 € (1 € × 1,03 × 1,03 × 1,0125 = 1,0742), aplicando las subidas de tablas del art. 48. El convenio no publica la cifra redondeada: confírmala en tu nómina. Además, la empresa debe facilitarte los medios (equipo) o compensarlos y puede pedir factura. El teletrabajo es voluntario, se formaliza en un acuerdo escrito y su reversión requiere preaviso de al menos 30 días.<br><b>Cotización e IRPF:</b> la Tesorería trata esta compensación como gasto excluido de la base de cotización. En el IRPF, una cantidad fija sin justificar gastos suele tributar; la app le aplica IRPF por defecto. Si tu nómina hace otra cosa, cambia la casilla.</div>
    <div class="note">Para planificar tus días de teletrabajo, usa <b>Calendario → Teletrabajo</b>.</div>

/* ============================ EDICIÓN DE DÍA ============================ */
function openDay(date){
  const e = dayEntry(date)||{}, t=tipoOf(date,e);
  const dt=new Date(date+"T12:00:00");
  const sh=document.getElementById("sheet");
  sh.innerHTML = `<h3>${dt.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</h3>
    <div class="note" style="margin:0">Teórico según tu calendario: ${fmtH(teorDia(date))}${esVerano(date)&&teorDia(date)?" · jornada intensiva":""}${esPartida(date)?` · comida ${S.perfil.pausaMin}–${S.perfil.pausaDef}′ (si no indicas pausa se aplican ${S.perfil.pausaDef}′)`:""}</div>
    <label>Tipo de día</label>
    <div class="typepick" id="tp">${TIPOS.map(([k,l])=>`<button data-t="${k}" class="${k===t?"on":""}">${l}</button>`).join("")}</div>
    <div id="hrs">
      <div class="grid3">
        <div><label>Entrada</label><input type="time" id="fE" value="${esc(e.e||"")}"></div>
        <div><label>Salida</label><input type="time" id="fS" value="${esc(e.s||"")}"></div>
        <div><label>Pausa (min)</label><input type="number" inputmode="numeric" id="fP" value="${esc(e.p??"")}" placeholder="${esPartida(date)?S.perfil.pausaDef:0}"></div>
      </div>
    </div>
    <label>Nota</label><input type="text" id="fN" value="${esc(e.n||"")}" placeholder="opcional">
    <div class="btns" style="margin-top:14px"><button class="btn" data-act="daySave" data-d="${date}">Guardar</button><button class="btn ghost" data-act="dayClose">Cancelar</button></div>
    <button class="btn danger" style="margin-top:10px" data-act="dayDel" data-d="${date}">Borrar registro del día</button>`;
  sh.dataset.t=t;
  toggleHrs(t);
  document.getElementById("sheetbg").classList.add("on");
}
function toggleHrs(t){ document.getElementById("hrs").style.display = NEUTROS.includes(t)&&t!=="libre" ? "none":"block"; }
function closeSheet(){ document.getElementById("sheetbg").classList.remove("on"); render(); }

function setDay(date, obj){
  const k=date.slice(0,7), md=monthDoc(+k.slice(0,4),+k.slice(5,7));
  if(obj===null) delete md.dias[date]; else md.dias[date]=obj;
  save("m-"+k);
}

/* ============================ EVENTOS ============================ */
document.addEventListener("click", ev=>{
  const b=ev.target.closest("button,[data-day],[data-cal]"); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(b.dataset.day){ openDay(b.dataset.day); return; }
  if(b.dataset.calmode){ calMode=b.dataset.calmode; render(); return; }
  if(b.dataset.cal){ calTap(b.dataset.cal); return; }
  if(b.dataset.t){ document.querySelectorAll("#tp button").forEach(x=>x.classList.toggle("on",x===b)); document.getElementById("sheet").dataset.t=b.dataset.t; toggleHrs(b.dataset.t); return; }
  const a=b.dataset.act; if(!a) return;
  if(a==="recibo"){ abrirRecibo(); return; }
  if(a==="recPrint"){ try{ window.print(); }catch(e){ setStatus("Tu navegador no permite imprimir desde aquí: usa Descargar",true); } return; }
  if(a==="recDown"){ const doc=`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recibo ${ymKey(cur.y,cur.m)}</title><style>${RECIBO_CSS} @page{size:A4;margin:12mm}</style></head><body>${reciboHTML(cur.y,cur.m)}</body></html>`;
    const blob=new Blob([doc],{type:"text/html"}); const u=URL.createObjectURL(blob); const l=document.createElement("a"); l.href=u; l.download=`recibo-${ymKey(cur.y,cur.m)}.html`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); setStatus("Recibo descargado"); return; }
  if(a==="actualizar"){ setStatus("Buscando actualización…"); if(window.__buscarActualizacion) window.__buscarActualizacion(); setTimeout(()=>{ try{ caches && caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).finally(()=>location.reload()); }catch(e){ location.reload(); } }, 1500); return; }
  if(a==="yprev"){ cur.y--; calScrolled=true; render(); window.scrollTo(0,0); return; }
  if(a==="ynext"){ cur.y++; calScrolled=true; render(); window.scrollTo(0,0); return; }
  if(a==="prev"){ cur.m--; if(cur.m<1){cur.m=12;cur.y--;} render(); }
  if(a==="next"){ cur.m++; if(cur.m>12){cur.m=1;cur.y++;} render(); }
  if(a==="in"){ const tk=todayKey(); const e={...(dayEntry(tk)||{})}; e.e=hhmm(); delete e.s; if(!e.t) e.t=tipoOf(tk,null)==="libre"?"trabajo":tipoOf(tk,null); setDay(tk,e); render(); }
  if(a==="out"){ const tk=todayKey(); const e={...(dayEntry(tk)||{})}; e.s=hhmm(); delete e.auto; if(e.p===undefined && esPartida(tk)) e.p=Number(S.perfil.pausaDef)||0; setDay(tk,e); render(); }
  if(a==="pausa"){ const tk=todayKey(); const e={...(dayEntry(tk)||{})}; e.p=Number(b.dataset.v); setDay(tk,e); render(); }
  if(a==="daySave"){
    const t=document.getElementById("sheet").dataset.t;
    const o={t}; const E=document.getElementById("fE").value, Sx=document.getElementById("fS").value, P=document.getElementById("fP").value, N=document.getElementById("fN").value.trim();
    if(!(NEUTROS.includes(t)&&t!=="libre")){ if(E) o.e=E; if(Sx) o.s=Sx; if(P!=="") o.p=Number(P); else if(E&&Sx&&esPartida(b.dataset.d)) o.p=Number(S.perfil.pausaDef)||0; }
    if(N) o.n=N;
    setDay(b.dataset.d,o); closeSheet();
  }
  if(a==="dayDel"){ setDay(b.dataset.d,null); closeSheet(); }
  if(a==="dayClose"){ closeSheet(); }
  if(a==="vacAdd"||a==="vacDel"){
    const d1=document.getElementById("vDesde").value, d2=document.getElementById("vHasta").value||d1;
    if(!d1){ setStatus("Elige la fecha de inicio",true); return; }
    let d=new Date(d1+"T12:00:00"), end=new Date(d2+"T12:00:00"), n=0;
    while(d<=end && n<400){ const k=dkey(d), e=dayEntry(k);
      if(a==="vacAdd"){ if(teorDia(k)>0 && !(e&&e.t==="festivo") && !(!e&&(libreAuto(k)||holiday(k)))) setDay(k,{t:"vacaciones",...(e&&e.n?{n:e.n}:{})}); }
      else if(e&&e.t==="vacaciones") setDay(k,null);
      d.setDate(d.getDate()+1); n++; }
    render();
  }
  if(a==="export"){ const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const u=URL.createObjectURL(blob); const l=document.createElement("a"); l.href=u; l.download=`mi-control-copia-${todayKey()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); setStatus("Copia descargada"); }
  if(a==="import"){ document.getElementById("impFile").click(); }
  if(a==="doImport"){ try{ const o=JSON.parse(document.getElementById("impTxt").value); if(!o.perfil) throw 0;
      S.perfil={...DEFAULT_PERFIL,...o.perfil, horasDia:{...DEFAULT_PERFIL.horasDia,...((o.perfil||{}).horasDia||{})}}; S.months=o.months||{}; S.nominas=o.nominas||{};
      save("perfil"); Object.keys(S.months).forEach(k=>save("m-"+k)); Object.keys(S.nominas).forEach(k=>save("nom-"+k));
      closeSheet(); setStatus("Datos restaurados"); }catch(e){ setStatus("El texto no es una copia válida",true); } }
});
function calTap(date){
  if(calMode==="edit"){ openDay(date); return; }
  if(calMode==="tele"){
    const e=dayEntry(date);
    if(teorDia(date)<=0){ setStatus("Día no laborable",true); return; }
    if(!e && (holiday(date)||libreAuto(date))){ setStatus("Festivo o día libre",true); return; }
    if(e && e.t==="teletrabajo"){ const o={...e,t:"trabajo"}; if(!o.e&&!o.s&&!o.n) setDay(date,null); else setDay(date,o); render(); return; }
    if(e && e.t && !["trabajo","teletrabajo"].includes(e.t)){ setStatus("Ese día ya está marcado como "+TIPOS.find(x=>x[0]===e.t)[1].toLowerCase(),true); return; }
    setDay(date,{...(e||{}),t:"teletrabajo"}); render(); return;
  }
  const e=dayEntry(date);
  if(e && e.t==="vacaciones"){ setDay(date, e.n?{t:"trabajo",n:e.n}:null); if(!e.n) setDay(date,null); render(); return; }
  if(teorDia(date)<=0){ setStatus("Día no laborable",true); return; }
  if(!e && holiday(date)){ setStatus(holiday(date).n+": festivo",true); return; }
  if(!e && libreAuto(date)){ setStatus(libreAuto(date)+": día libre retribuido",true); return; }
  if(e && (e.e||e.s)){ openDay(date); return; }
  if(e && e.t && e.t!=="trabajo"){ openDay(date); return; }
  setDay(date,{t:"vacaciones"}); setStatus("Vacaciones: "+new Date(date+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"})); render();
}
function openText(txt){ const sh=document.getElementById("sheet"); sh.innerHTML=`<h3>Copia de seguridad</h3><div class="note">Selecciona y copia este texto.</div><textarea rows="8" readonly>${esc(txt)}</textarea><button class="btn ghost" style="margin-top:10px" data-act="dayClose">Cerrar</button>`; document.getElementById("sheetbg").classList.add("on"); }
function openImport(){ const sh=document.getElementById("sheet"); sh.innerHTML=`<h3>Restaurar datos</h3><div class="note">Pega una copia de seguridad. Sustituirá los datos actuales.</div><textarea id="impTxt" rows="8"></textarea><div class="btns" style="margin-top:10px"><button class="btn" data-act="doImport">Restaurar</button><button class="btn ghost" data-act="dayClose">Cancelar</button></div>`; document.getElementById("sheetbg").classList.add("on"); }
document.getElementById("sheetbg").addEventListener("click",ev=>{ if(ev.target.id==="sheetbg") closeSheet(); });

document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.id==="impFile" && el.files[0]){ el.files[0].text().then(t=>{ try{ const o=JSON.parse(t); if(!o.perfil) throw 0;
      S.perfil={...DEFAULT_PERFIL,...o.perfil, horasDia:{...DEFAULT_PERFIL.horasDia,...(o.perfil.horasDia||{})}}; S.months=o.months||{}; S.nominas=o.nominas||{};
      lsSave(); render(); setStatus("Copia restaurada"); }catch(e){ setStatus("El archivo no es una copia válida",true); } }); el.value=""; return; }
  if(el.dataset.p){
    const k=el.dataset.p; let v = el.type==="checkbox"?el.checked:el.value;
    if(["nivel","sbManual","cpeAnios","pae","otros","jornadaPct","irpf","heRecargo","teleEur","vacAnterior","vacBase","brutoAnual","numPagas","varPct","varCumpl","varMes","pausaDef","pausaMin","telePct","varConvPct","varDesde"].includes(k)) v = v===""?0:Number(v);
    if(k==="mesesExtra"||k==="veranoMeses") v = String(v).split(/[^0-9]+/).map(Number).filter(n=>n>=1&&n<=12);
    if(k==="veranoHoras"){ const h=Number(v)||0; S.perfil.horasVerano={0:0,1:h,2:h,3:h,4:h,5:h,6:0}; save("perfil"); render(); return; }
    if(k==="cpeAnios") v=Math.min(10,Math.max(0,v));
    S.perfil[k]=v; save("perfil"); render();
  }
  if(el.dataset.cumplealt){ S.perfil.cumpleAlt={...(S.perfil.cumpleAlt||{})}; if(el.value) S.perfil.cumpleAlt[el.dataset.cumplealt]=el.value; else delete S.perfil.cumpleAlt[el.dataset.cumplealt]; save("perfil"); render(); return; }
  if(el.dataset.hd!==undefined){ S.perfil.horasDia={...S.perfil.horasDia,[el.dataset.hd]:Number(el.value)||0}; save("perfil"); render(); }
  if(el.dataset.nm){
    const y=String(cur.y), m=pad(cur.m); if(!S.nominas[y]) S.nominas[y]={};
    const o={...(S.nominas[y][m]||{})}; const v=el.value;
    if(v==="") delete o[el.dataset.nm]; else o[el.dataset.nm]= el.type==="number"?Number(v):v;
    S.nominas[y][m]=o; save("nom-"+y); render();
  }
});

setInterval(()=>{ const c=document.getElementById("clock"); if(c) c.textContent=hhmm(); if(autoClose() && !document.querySelector(".sheet-bg.on") && !isTyping()) render(); },15000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && autoClose()) render(); });
render();
initStore();
</script>
<div id="printArea"></div>
</body>
</html>
